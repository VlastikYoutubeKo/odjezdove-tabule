; Nastavení OmsiTabule (plugin i samostatný program)

; Adresa serveru, např. https://odjezdove-tabule.<ucet>.workers.dev/api/vehicles
server=http://localhost:8080/api/vehicles
; Token ze serveru (TOKENS)
token=
; Vaše jméno v seznamu vozů
driver=
; ID hráče; prázdné = název počítače
id=
; ID mapy ze souboru data/stops.json; prázdné = odvodí se z názvu mapy v OMSI
map=
; Jak často posílat (sekundy, min. 2)
interval=5
; Posílat i AI autobusy (1/0)
include_ai=1
; Po načtení mapy uložit jízdní řád do složky export (1/0)
export_on_load=1
; Převod zpoždění na sekundy (kdyby OMSI počítalo v jiných jednotkách)
delay_scale=1

; Když hráč nejede podle jízdního řádu OMSI, lze linku/cíl/zastávku číst
; z proměnných skriptu autobusu (názvy najdete ve stringvarlist skriptu vozu):
player_line_var=
player_headsign_var=
player_next_stop_var=
