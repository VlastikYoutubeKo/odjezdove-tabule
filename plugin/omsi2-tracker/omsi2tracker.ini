[tracker]
; Adresa serveru (viz server/README.md)
server=http://localhost:8080/api/vehicles
; Token z server/config.json
token=
; Jak se zobrazíte v seznamu vozů
driver=
vehicle=
; ID mapy ze souboru data/stops.json (např. autobahnmap). Když chybí, server ji odhadne podle zastávky.
map=
; Unikátní ID vozu. Když chybí, použije se název počítače.
id=
; Jak často posílat data (sekundy, min. 2)
interval=5
; Převod hodnoty zpoždění na sekundy (např. 60, pokud skript vozu počítá v minutách)
delay_scale=1
