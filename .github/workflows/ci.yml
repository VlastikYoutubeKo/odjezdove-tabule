name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: server

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - run: ./plugin/omsi2-tracker/build-mingw.sh
      - run: cp plugin/omsi2-tracker/omsi2tracker.opl plugin/omsi2-tracker/omsi2tracker.ini plugin/omsi2-tracker/build/
      - uses: actions/upload-artifact@v4
        with:
          name: omsi2tracker
          path: plugin/omsi2-tracker/build/

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx wrangler deploy --dry-run --outdir worker/dist

  omsihook-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testy
        run: dotnet test plugin/omsihook-tabule/Tests
      - name: Plugin do OMSI
        run: dotnet build plugin/omsihook-tabule/Plugin -c Release -o out/plugins
      - name: Samostatný program
        run: dotnet publish plugin/omsihook-tabule/Cli -c Release -o out/program
      - name: Kontrola nativní DLL
        shell: pwsh
        run: if (-not (Test-Path out/plugins/OmsiTabuleNE.dll)) { throw "Chybí OmsiTabuleNE.dll" }
      - uses: actions/upload-artifact@v4
        with:
          name: OmsiTabule-plugin
          path: out/plugins/
      - uses: actions/upload-artifact@v4
        with:
          name: OmsiTabule-program
          path: out/program/
