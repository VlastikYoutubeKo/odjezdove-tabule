<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa vozů</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/mapa.css">
</head>
<body class="map-page">
  <header class="map-bar">
    <h1>Mapa vozů</h1>
    <select id="map-select" aria-label="Mapa"></select>
    <span class="muted" id="info">Načítám…</span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="show-ai" checked> AI</label>
    <label class="toggle"><input type="checkbox" id="show-trails" checked> Stopy</label>
    <button type="button" id="fit">Vycentrovat</button>
    <nav><a href="index.html">Zastávky</a> <a href="vozy.html">Seznam</a></nav>
  </header>

  <main class="map-wrap">
    <svg id="map" role="img" aria-label="Poloha vozů na mapě">
      <g id="viewport">
        <g id="trails"></g>
        <g id="vehicles"></g>
      </g>
    </svg>
    <div class="scale" id="scale"></div>
    <aside class="detail" id="detail" hidden></aside>
    <p class="empty muted" id="empty" hidden>
      Na této mapě teď nikdo s polohou nejezdí.<br>
      Polohu posílá plugin OmsiTabule (verze 0.1 a novější).
    </p>
  </main>

  <script src="assets/js/mapa.js"></script>
</body>
</html>
