name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        working-directory: server

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686
      - run: ./plugin/omsi2-tracker/build-mingw.sh
      - run: cp plugin/omsi2-tracker/omsi2tracker.opl plugin/omsi2-tracker/omsi2tracker.ini plugin/omsi2-tracker/build/
      - uses: actions/upload-artifact@v4
        with:
          name: omsi2tracker
          path: plugin/omsi2-tracker/build/

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: worker
      - run: npx wrangler deploy --dry-run --outdir dist
        working-directory: worker
