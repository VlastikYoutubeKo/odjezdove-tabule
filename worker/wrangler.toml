name = "odjezdove-tabule"
main = "index.js"
compatibility_date = "2025-09-01"

# Web a data/ se před spuštěním zkopírují do public/ (build.mjs)
[build]
command = "node build.mjs"
watch_dir = ["../assets", "../data", "../server/core.js", "index.js"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/data/config.json"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "VehicleHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VehicleHub"]

[vars]
CLOCK = "real"
TIME_ZONE = "Europe/Prague"
VEHICLE_TIMEOUT_SECONDS = "60"
# Tokeny pro plugin NEPATŘÍ sem, nastavte je jako secret:
#   npx wrangler secret put TOKENS     (více tokenů oddělte čárkou)
