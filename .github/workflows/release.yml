name: Release

# Vydání pluginu: vytvořte tag vX.Y.Z (GitHub → Releases → Draft a new release → nový tag,
# nebo `git tag v1.0.0 && git push origin v1.0.0`), případně spusťte ručně z karty Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Verze, např. 1.0.0 (vytvoří tag v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  omsihook:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verze
        id: v
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Neplatná verze: $v (čekám např. 1.0.0)" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Testy
        run: dotnet test plugin/omsihook-tabule/Tests
      - name: Plugin do OMSI
        run: dotnet build plugin/omsihook-tabule/Plugin -c Release -o out/plugin -p:Version=${{ steps.v.outputs.version }}
      - name: Samostatný program
        run: dotnet publish plugin/omsihook-tabule/Cli -c Release -o out/program -p:Version=${{ steps.v.outputs.version }}
      - name: Balíčky
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          if (-not (Test-Path out/plugin/OmsiTabuleNE.dll)) { throw "Chybí OmsiTabuleNE.dll" }
          Remove-Item out/plugin/*.pdb, out/program/*.pdb -ErrorAction SilentlyContinue
          Copy-Item plugin/omsihook-tabule/INSTALACE.txt out/plugin/, out/program/
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/plugin/* -DestinationPath "dist/OmsiTabule-plugin-$v.zip"
          Compress-Archive -Path out/program/* -DestinationPath "dist/OmsiTabule-program-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-omsihook
          path: dist/

  legacy:
    needs: omsihook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686 zip
      - run: ./plugin/omsi2-tracker/build-mingw.sh
      - name: Balíček
        run: |
          v="${{ needs.omsihook.outputs.version }}"
          cd plugin/omsi2-tracker
          cp omsi2tracker.opl omsi2tracker.ini README.md build/
          mkdir -p ../../dist
          (cd build && zip -q "../../../dist/omsi2tracker-zaloha-$v.zip" *)
      - uses: actions/upload-artifact@v4
        with:
          name: release-legacy
          path: dist/

  release:
    needs: [omsihook, legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.omsihook.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OmsiTabule ${{ needs.omsihook.outputs.version }}
          prerelease: ${{ contains(needs.omsihook.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            ## Ke stažení
            - **OmsiTabule-plugin** – plugin do `OMSI 2\plugins\` (doporučeno)
            - **OmsiTabule-program** – totéž jako samostatný program vedle hry (bezpečnější na testování)
            - **omsi2tracker-zaloha** – jednoduchý záložní plugin pro jiné verze OMSI než 2.3.004

            Vyžaduje **OMSI 2.3.004** a **.NET 8 Runtime x86**. Návod je v `INSTALACE.txt` v každém ZIPu.
